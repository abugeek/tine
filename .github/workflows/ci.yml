name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: Lint, no_std & Policy
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: lint
          cache-on-failure: true

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check no_std builds
        run: |
          cargo check -p tine-protocol --no-default-features
          cargo check -p tine-dsp --no-default-features

      - name: Check dependencies (cargo-deny)
        run: cargo deny check

      - name: Enforce dependency direction
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Assert-NoDep($Crate, $Forbidden, $DepthArg = @()) {
            $tree = cargo tree -e normal -p $Crate @DepthArg
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            foreach ($dep in $Forbidden) {
              $pattern = "^[├└│\s─]+$dep\s"
              $match = $tree | Select-String -Pattern $pattern
              if ($match) {
                Write-Error "Dependency violation: '$Crate' must not depend on '$dep':`n$($match -join "`n")"
                exit 1
              }
            }
          }

          Assert-NoDep "tine-dsp" @("windows", "cpal", "serde_json", "rune")
          Assert-NoDep "tine-ui"  @("tine-engine", "cpal")
          Assert-NoDep "tine-ui"  @("windows") @("--depth", "1")
          Write-Host "Dependency direction checks passed."

  test:
    name: Tests (nextest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: test
          cache-on-failure: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run tests (nextest)
        run: cargo nextest run --workspace

  size-gate:
    name: Release Binary Size Gate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release
          cache-on-failure: true

      - name: Build release & check artifact sizes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --release -p tine-app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $appExe = Get-Item "target/release/tine.exe"
          Write-Host ("tine.exe size: {0:N0} bytes ({1:N2} MiB)" -f $appExe.Length, ($appExe.Length / 1MB))

          if ($appExe.Length -ge 30MB) {
            Write-Error "tine.exe exceeds 30 MB budget!"
            exit 1
          }
