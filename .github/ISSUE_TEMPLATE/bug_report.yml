name: Bug report
description: Something doesn't work as expected in Tine.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you file:** please run `tine status` and `tine diag`
        (from a terminal) and attach the outputs — the diag bundle is
        privacy-safe (no audio inside, device ids hashed). Screenshots
        that show the problem help a lot.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: `tine status` output
      description: Open a terminal and run `tine status` with Tine running (paste serially; if the app won't start, paste the last lines of `%LOCALAPPDATA%\Tine\logs\tine.log`).
      render: text
  - type: textarea
    id: diag
    attributes:
      label: `tine diag` bundle
      description: Run `tine diag` and attach the produced `tine-diag.zip`.
  - type: input
    id: version
    attributes:
      label: Tine version
      description: "`tine --version` (e.g. 0.1.0), or 'unreleased / built from source @<commit>'"
    validations:
      required: true
  - type: dropdown
    id: install-kind
    attributes:
      label: How did you install?
      options:
        - Official MSI (Releases)
        - Portable zip
        - Built from source
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Microphone & routing
      description: Microphone model/type, the virtual cable in use (VB-Cable version…), and the app that showed the problem (Discord, OBS, a game…).
    validations:
      required: true
  - type: dropdown
    id: hardware-kind
    attributes:
      label: Mic archetype (if known)
      options:
        - Dynamic (USB/XLR)
        - Condenser
        - Headset boom / lapel
        - Webcam / laptop built-in
        - Bluetooth headset
        - Other / not sure
  - type: textarea
    id: os
    attributes:
      label: Windows version
      description: "e.g. Windows 11 24H2 (build 26100), Windows 10 22H2"
    validations:
      required: true
