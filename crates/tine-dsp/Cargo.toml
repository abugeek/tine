[package]
name = "tine-dsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
std = ["tine-protocol/std"]
deepfilter = ["std", "dep:dfn3_rs"]

[dependencies]
tine-protocol.workspace = true
nnnoiseless.workspace = true
rubato.workspace = true
dfn3_rs = { workspace = true, optional = true }

[dev-dependencies]
assert_no_alloc.workspace = true
claxon.workspace = true
criterion.workspace = true
hound.workspace = true
proptest.workspace = true
realfft.workspace = true
serde_json.workspace = true
# Test-only: JSON schema types (Preset/EndpointProfile) + serde derives on Calibration.
# Never enabled for the library target, so tine-dsp itself still has zero serde dependency.
tine-protocol = { workspace = true, features = ["serde"] }

[[bench]]
name = "pipeline"
harness = false

[lints]
workspace = true
